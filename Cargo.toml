[workspace]
resolver = "3"
members = [
    "crates/airlock-journal",
    "crates/airlock-tools",
    "crates/airlock-sandbox",
    "crates/airlock-core",
    "crates/airlock-egress",
    "crates/airlock-cli",
    "gui/src-tauri",
]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
airlock-journal = { path = "crates/airlock-journal" }
airlock-tools   = { path = "crates/airlock-tools" }
airlock-sandbox = { path = "crates/airlock-sandbox" }
airlock-core    = { path = "crates/airlock-core" }
airlock-egress  = { path = "crates/airlock-egress" }

async-trait = "0.1"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
sha2        = "0.10"
hex         = "0.4"
thiserror   = "2"
time        = { version = "0.3", features = ["formatting", "macros"] }
# `io-util` is used by airlock-sandbox for the write-over-stdin path. It only
# built before because another crate happened to enable it — building the
# sandbox crate on its own exposed the missing declaration.
tokio       = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "fs", "io-util"] }
