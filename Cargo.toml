[workspace]
resolver = "3"
members = [
    "crates/locked-journal",
    "crates/locked-tools",
    "crates/locked-sandbox",
    "crates/locked-core",
    "crates/locked-egress",
    "crates/locked-cli",
    "gui/src-tauri",
]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
locked-journal = { path = "crates/locked-journal" }
locked-tools   = { path = "crates/locked-tools" }
locked-sandbox = { path = "crates/locked-sandbox" }
locked-core    = { path = "crates/locked-core" }
locked-egress  = { path = "crates/locked-egress" }

async-trait = "0.1"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
sha2        = "0.10"
hex         = "0.4"
thiserror   = "2"
time        = { version = "0.3", features = ["formatting", "macros"] }
# `io-util` is used by locked-sandbox for the write-over-stdin path. It only
# built before because another crate happened to enable it — building the
# sandbox crate on its own exposed the missing declaration.
tokio       = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "fs", "io-util"] }
